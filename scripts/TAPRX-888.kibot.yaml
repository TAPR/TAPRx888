# KiBot pipeline for TAPRX-888 -- fab-agnostic base, JLCPCB turnkey profile.
#
# Provenance (title-block rev + GIT_HASH) is injected by
# scripts/inject_provenance.py BEFORE kibot runs; this file only *generates*.
# See docs/RELEASE_STRATEGY.md for the design rationale.
#
# TAPRX-888 is a 6-layer board (F/In1/In2/In3/In4/B.Cu); the gerber layer list
# and any layer-count assumptions below reflect that.
#
# Output dirs (relative to the -d/--out-dir passed on the CLI):
#   docs/          interactive HTML BOM (schematic PDF comes from build_release.sh)
#   fab/           STEP, 3D renders                          (release)
#   JLCPCB/        CPL (rotation-corrected), LCSC BOM        (release)
#   JLCPCB/gerbers gerbers + drill (the board-fab upload)    (release)
kibot:
  version: 1

# --- Gate checks defined as preflights (ERC/DRC honor the project rules) ------
# The release build skips these (--skip-pre all): gating already happened on the
# PR into main via dev-checks. They live here so a future dev run can share them.
preflight:
  erc: true
  drc: true
  update_xml: true

# --- Variants -----------------------------------------------------------------
# `rotated` applies KiBot's JLCPCB rotation database via the _rot_footprint
# transform, so the CPL matches how JLCPCB's placement machines orient parts.
# Per-part nudges via a `JLCRotOffset` field; no global table to maintain.
variants:
  - name: rotated
    comment: 'JLCPCB rotation-corrected placement'
    type: kibom
    variant: rotated
    pre_transform: _rot_footprint

# --- Reusable filters ---------------------------------------------------------
filters:
  - name: only_jlc_parts
    comment: 'Only parts with an LCSC number (orderable turnkey)'
    type: generic
    include_only:
      - column: 'LCSC Part #'
        regex: '^C\d+'

# --- Outputs ------------------------------------------------------------------
outputs:
  # ---- docs (release) ----
  # The schematic PDF is rendered by scripts/build_release.sh with kicad-cli,
  # NOT KiBot: kicad-cli plots the title block natively and fills every frame
  # variable, whereas KiBot's frame renderer left them blank in our container.
  # KiBot here produces only the interactive HTML BOM (kicad-cli has no
  # equivalent).
  - name: ibom
    comment: 'Interactive HTML BOM'
    type: ibom
    dir: docs
    options:
      dark_mode: true
      extra_fields: 'LCSC Part #,MFG,MPN'

  # ---- fab (release) ----
  # NOTE: these 3D outputs are DEFINED but not yet invoked by build_release.sh:
  # the footprints reference custom 3D models via ${TIS}/${KISYS3DMOD}, absent
  # from the CI image, so KiBot cannot resolve them. Re-enable once the model
  # library is provisioned (or the 3D paths are remapped to KiCad standards).
  - name: step
    comment: '3D model (STEP)'
    type: step
    dir: fab
    options:
      output: TAPRX-888.step

  - name: render_top
    comment: '3D render -- top'
    type: render_3d
    dir: fab
    options:
      output: TAPRX-888-3d-top.png
      ray_tracing: false
      view: top

  - name: render_bottom
    comment: '3D render -- bottom'
    type: render_3d
    dir: fab
    options:
      output: TAPRX-888-3d-bottom.png
      ray_tracing: false
      view: bottom

  # ---- JLCPCB turnkey (release) ----
  - name: JLCPCB_gerbers
    comment: 'Gerbers (JLCPCB profile, 6-layer)'
    type: gerber
    dir: JLCPCB/gerbers
    options:
      exclude_edge_layer: true
      exclude_pads_from_silkscreen: true
      plot_sheet_reference: false
      plot_footprint_refs: true
      plot_footprint_values: false
      force_plot_invisible_refs_vals: false
      tent_vias: true
      use_protel_extensions: true
      create_gerber_job_file: false
      disable_aperture_macros: true
      gerber_precision: 4.6
      use_gerber_x2_attributes: false
      use_gerber_net_attributes: false
      line_width: 0.1
      subtract_mask_from_silk: true
      inner_extension_pattern: '.g%n'
    layers:
      - F.Cu
      - In1.Cu
      - In2.Cu
      - In3.Cu
      - In4.Cu
      - B.Cu
      - F.SilkS
      - B.SilkS
      - F.Mask
      - B.Mask
      - Edge.Cuts

  - name: JLCPCB_drill
    comment: 'Drill files (JLCPCB profile)'
    type: excellon
    dir: JLCPCB/gerbers
    options:
      pth_and_npth_single_file: false
      pth_id: '-PTH'
      npth_id: '-NPTH'
      metric_units: true
      map: gerber
      route_mode_for_oval_holes: false
      output: '%f%i.%x'

  - name: JLCPCB_position
    comment: 'CPL / placement (rotation-corrected)'
    type: position
    dir: JLCPCB
    options:
      variant: rotated
      output: TAPRX-888-cpl.csv
      format: CSV
      units: millimeters
      separate_files_for_front_and_back: false
      only_smd: false
      columns:
        - id: Ref
          name: Designator
        - Val
        - Package
        - id: PosX
          name: 'Mid X'
        - id: PosY
          name: 'Mid Y'
        - id: Rot
          name: Rotation
        - id: Side
          name: Layer

  - name: JLCPCB_bom
    comment: 'BOM (LCSC / JLCPCB)'
    type: bom
    dir: JLCPCB
    options:
      output: TAPRX-888-bom.csv
      exclude_filter: only_jlc_parts
      ref_separator: ','
      columns:
        - field: Value
          name: Comment
        - field: References
          name: Designator
        - Footprint
        - field: 'LCSC Part #'
          name: 'LCSC Part #'
      csv:
        hide_pcb_info: true
        hide_stats_info: true
        quote_all: true
