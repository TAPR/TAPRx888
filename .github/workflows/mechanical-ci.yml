name: mechanical-ci

# Mechanical fit-check for the design / dev-* lanes: build the multi-component
# STEP + coloured GLB + self-contained viewer (via the reusable mechanical-build
# workflow) and publish the live viewer to GitHub Pages.
#
# The actual build lives in .github/workflows/mechanical-build.yml so this lane
# and dev-release share ONE source of truth. NON-GATING during bring-up. Board
# connector 3D models are still missing (issue #45).
#
# Note: `dev` merges are handled by dev-release.yml (which folds the mechanical
# assembly into the v0.x pre-release and deploys the same viewer to Pages), so
# `dev` is deliberately NOT in the push branches below -- keeping it out avoids a
# duplicate build + Pages deploy on every dev merge.

on:
  push:
    branches: [design, 'dev-*']
    paths: &mech_paths
      - 'TAPRX-888.kicad_pcb'
      - '3d/**'
      - 'mechanical/**'
      - 'scripts/assemble_mechanical.py'
      - 'scripts/assemble_glb.py'
      - 'scripts/make_3d_viewer.py'
      - '.github/workflows/mechanical-ci.yml'
      - '.github/workflows/mechanical-build.yml'
      # Docs under mechanical/ or 3d/ (READMEs) shouldn't rebuild the assembly.
      - '!**/*.md'
  pull_request:
    branches: [dev, main]
    paths: *mech_paths
  workflow_dispatch:

concurrency:
  group: mechanical-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared build (boards-step + assemble) -- single source of truth. Uploads the
  # `board-parts` and `mechanical-assembly` artifacts into this run.
  build:
    uses: ./.github/workflows/mechanical-build.yml

  # Publish the self-contained viewer to GitHub Pages so the wiki can link a
  # live URL (https://tapr.github.io/TAPRx888/) that refreshes each build.
  # Push / manual only -- never from PRs (a PR must not move the live site).
  # Non-gating like the rest; needs Pages enabled once (Settings -> Pages ->
  # Source: GitHub Actions). See mechanical/README.md.
  pages:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mechanical-assembly
          path: dl
      - name: Lay out the Pages site (viewer as index.html)
        run: |
          set -euxo pipefail
          mkdir -p site
          cp dl/TAPRX-888-mechanical-viewer.html site/index.html
          ls -la site
      # enablement: true asks the API to turn Pages on (Actions build type) so a
      # first run doesn't require the manual toggle; harmless once already on.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
